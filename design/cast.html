<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Tutor — ตัวละครทั้งหมด</title>
<style>
  :root{--canvas:#f7f2ed;--ink:#14213d;--muted:#6b768e;--tang:#ff8a00}
  *{box-sizing:border-box}
  body{margin:0;padding:28px 24px 60px;background:var(--canvas);color:var(--ink);
       font:14px/1.55 system-ui,-apple-system,"Noto Sans Thai",sans-serif}
  h1{font-size:24px;margin:0 0 4px;font-weight:800}
  .sub{color:var(--muted);margin:0 0 22px;max-width:760px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;max-width:1280px}
  .card{background:#fff;border-radius:24px;padding:10px 10px 14px;box-shadow:0 2px 10px -2px rgb(20 33 61/.08);
        cursor:pointer;transition:transform .12s, box-shadow .12s;position:relative}
  .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px -10px rgb(20 33 61/.22)}
  .card.talk{outline:3px solid var(--tang)}
  .stage{border-radius:18px;overflow:hidden;aspect-ratio:5/6}
  .stage svg{width:100%;height:100%;display:block}
  .name{font-weight:800;font-size:17px;margin:10px 4px 0}
  .meta{font-size:12px;color:var(--muted);margin:0 4px}
  .tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 4px 0}
  .tag{font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
  .hint{position:absolute;right:16px;top:16px;background:#fff;border-radius:99px;padding:3px 9px;
        font-size:11px;font-weight:800;color:var(--tang);opacity:0;transition:opacity .15s}
  .card:hover .hint{opacity:1}
</style>
</head>

/* ===================== ประกอบ ===================== */
function build(c, i) {
  const [SKIN, SH, BL] = SKINS[c.skin];
  const h = HAIR[c.hair];
  const sub = (s) => s.replaceAll('{H}', c.H).replaceAll('{A}', c.A || '#FFC53D')
                      .replaceAll('{S}', c.S).replaceAll('{SK}', SH).replaceAll('{CLIP}', `clip${i}`);
  const bg = ['#DDEFFB','#FFE9D2','#ECE0FF','#DDF8CB','#FFF3D6','#FFE4E4'][i % 6];

  const eyeR = c.kid ? 25 : (c.wrinkles ? 19 : 23);
  const pupil = c.kid ? 14 : (c.wrinkles ? 10 : 12);

  const glasses = c.glasses ? `
    <g fill="none" stroke="${c.glasses}" stroke-width="5">
      <circle cx="165" cy="188" r="${eyeR+8}"/><circle cx="235" cy="188" r="${eyeR+8}"/>
      <path d="M${165+eyeR+8} 186 Q200 176 ${235-eyeR-8} 186"/>
      <path d="M${165-eyeR-8} 184 L126 176"/><path d="M${235+eyeR+8} 184 L274 176"/>
    </g>` : '';

  const wrinkles = c.wrinkles ? `
    <g fill="none" stroke="${SH}" stroke-width="3.5" stroke-linecap="round">
      <path d="M170 126 q30 -8 60 0"/><path d="M178 138 q22 -6 44 0"/>
      <path d="M150 244 q-8 16 2 30"/><path d="M250 244 q8 16 -2 30"/>
      <path d="M130 196 l-8 -4"/><path d="M270 196 l8 -4"/>
    </g>` : '';

  const freckles = c.freckles ? `
    <g fill="${SH}"><circle cx="140" cy="226" r="3"/><circle cx="152" cy="232" r="3"/><circle cx="146" cy="220" r="2.5"/>
    <circle cx="260" cy="226" r="3"/><circle cx="248" cy="232" r="3"/><circle cx="254" cy="220" r="2.5"/></g>` : '';

  const beard = c.beard ? `<path d="M130 236 Q134 306 200 322 Q266 306 270 236 Q258 290 200 294 Q142 290 130 236 Z" fill="${c.H}"/>
                            <path d="M170 256 Q185 244 200 252 Q215 244 230 256 Q215 262 200 256 Q185 262 170 256 Z" fill="${c.H}"/>` : '';
  const stubble = c.stubble ? `<path d="M134 250 Q138 304 200 316 Q262 304 266 250 Q250 292 200 296 Q150 292 134 250 Z" fill="${c.H}" opacity=".18"/>` : '';
  const mustache = c.mustache ? `<path d="M166 252 Q184 238 200 248 Q216 238 234 252 Q216 262 200 254 Q184 262 166 252 Z" fill="${c.mustache}"/>` : '';
  const earrings = c.earrings ? `<circle cx="124" cy="244" r="7" fill="${c.earrings}"/><circle cx="276" cy="244" r="7" fill="${c.earrings}"/>` : '';

  return `
  <svg viewBox="40 60 320 384" preserveAspectRatio="xMidYMid slice">
    <defs><clipPath id="clip${i}"><path d="M40 490 Q46 358 136 316 L264 316 Q358 358 366 490 Z"/></clipPath></defs>
    <rect x="0" y="0" width="400" height="480" fill="${bg}"/>
    <g class="neck"><path d="M176 258 L224 258 L246 382 L154 382 Z" fill="${SH}"/></g>
    <g class="body">${sub(OUTFIT[c.outfit])}</g>
    <g class="head">
      ${sub(h.back)}
      <path d="${FACES[c.face]}" fill="${SKIN}"/>
      <ellipse cx="150" cy="232" rx="19" ry="11" fill="${BL}" opacity=".5"/>
      <ellipse cx="250" cy="232" rx="19" ry="11" fill="${BL}" opacity=".5"/>
      ${freckles}${wrinkles}${stubble}${earrings}
      <circle cx="165" cy="188" r="${eyeR}" fill="${WHITE}"/>
      <circle cx="235" cy="188" r="${eyeR}" fill="${WHITE}"/>
      <g class="pupils"><circle cx="167" cy="195" r="${pupil}" fill="${DARK}"/><circle cx="237" cy="195" r="${pupil}" fill="${DARK}"/>
        ${c.kid ? `<circle cx="172" cy="189" r="4" fill="#fff"/><circle cx="242" cy="189" r="4" fill="#fff"/>` : ''}</g>
      <g class="lids"><rect x="136" y="-60" width="58" height="60" fill="${SKIN}"/><rect x="206" y="-60" width="58" height="60" fill="${SKIN}"/></g>
      <g class="brows" fill="none" stroke="${c.hair==='hijab' ? '#3B2B2B' : c.H}" stroke-width="7" stroke-linecap="round">
        <path d="M146 156 q20 -11 42 -3"/><path d="M212 153 q20 -9 42 3"/></g>
      ${glasses}
      <path d="M200 214 q9 16 -7 19" fill="none" stroke="${SH}" stroke-width="6" stroke-linecap="round"/>
      ${beard}
      <g class="jaw"><g class="mouth"></g></g>
      ${mustache}
      ${sub(h.front)}
    </g>
  </svg>`;
}

  MBP:`<rect x="-18" y="-4" width="36" height="7.5" rx="3.75" fill="${DARK}"/>`,
  E:`<ellipse rx="21" ry="10" fill="${DARK}"/><rect x="-16" y="-8.5" width="32" height="5" rx="2.5" fill="${WHITE}"/><ellipse cy="6" rx="11" ry="3.6" fill="${TONGUE}"/>`,
  AA:`<ellipse cy="2" rx="17" ry="17" fill="${DARK}"/><rect x="-12" y="-13.5" width="24" height="5" rx="2.5" fill="${WHITE}"/><ellipse cy="11" rx="9.5" ry="5" fill="${TONGUE}"/>`,
  O:`<ellipse rx="12" ry="14.5" fill="${DARK}"/>`,
  U:`<ellipse rx="7.5" ry="9.5" fill="${DARK}"/>`,
};
const OPEN = {rest:0, MBP:0, U:.3, E:.5, O:.6, AA:1};
const LEVELS = [[.08,['MBP','rest']],[.3,['U']],[.5,['E']],[.7,['O']],[1.1,['AA','E']]];

/* ===================== วางการ์ด + อนิเมชัน ===================== */
const grid = document.getElementById('grid');
const actors = CAST.map((c, i) => {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<div class="hint">▶ พูด</div><div class="stage">${build(c, i)}</div>
    <div class="name">${c.name} <span style="color:#aeb6c6;font-weight:700;font-size:13px">${c.age}</span></div>
    <div class="meta">${c.role}</div>
    <div class="tags">${c.tags.map(([t,bg,fg])=>`<span class="tag" style="background:${bg};color:${fg}">${t}</span>`).join('')}</div>`;
  grid.appendChild(card);
  const q = (s) => card.querySelector(s);
  const a = { c, card, head:q('.head'), neck:q('.neck'), body:q('.body'), lids:q('.lids'), pupils:q('.pupils'),
              jaw:q('.jaw'), mouth:q('.mouth'), talking:false,
              pose:{r:0,x:0,y:0}, to:{r:0,x:0,y:0}, next:Math.random()*2,
              blink:0, nextBlink:1+Math.random()*3, shape:'rest', open:0, band:-1, lastShape:0, phase:Math.random()*6 };
  a.mouth.innerHTML = MOUTH.rest;
  card.onclick = () => speak(a);
  return a;
});

const signed = (a,b) => (Math.random()<.5?-1:1)*(a+Math.random()*(b-a));
let last = performance.now();
function tick(now){
  requestAnimationFrame(tick);
  const t = now/1000, dt = Math.min(.05,(now-last)/1000); last = now;
  for (const a of actors){
    const tt = t + a.phase;
    if (t >= a.next){ const amp = a.talking?1:.6;
      a.to = {r:signed(1.8,4.5)*amp, x:signed(2,5.5)*amp, y:signed(1,3)*amp};
      a.next = t + (a.talking ? 1.4+Math.random()*1.2 : 2.4+Math.random()*2.5); }
    const k = Math.min(1, dt*2.6);
    a.pose.r += (a.to.r-a.pose.r)*k; a.pose.x += (a.to.x-a.pose.x)*k; a.pose.y += (a.to.y-a.pose.y)*k;
    const br = Math.sin(tt*1.15)*2.6;
    a.body.setAttribute('transform', `translate(0 ${br})`);
    const hx=a.pose.x, hy=a.pose.y+br*.5, hr=a.pose.r;
    a.head.setAttribute('transform', `translate(${hx} ${hy}) rotate(${hr} 200 306)`);
    a.neck.setAttribute('transform', `translate(${hx*.35} ${hy*.35}) rotate(${hr*.3} 200 382)`);

    if (t >= a.nextBlink){ a.blink=1; a.nextBlink=t+2+Math.random()*3.5; }
    if (a.blink>0) a.blink=Math.max(0,a.blink-dt*8);
    const eyeR = a.c.kid ? 25 : (a.c.wrinkles ? 19 : 23);
    const top = 188-eyeR, h = eyeR*2+4;
    const base = a.c.kid ? .08 : (a.c.wrinkles ? .4 : .32);
    const amt = Math.sin(Math.min(1,1-a.blink)*Math.PI);
    a.lids.setAttribute('transform', `translate(0 ${top + (base+(1-base)*amt)*h})`);

    let level = a.talking ? (Math.sin(tt*13)+1)*.32 : 0;
    const band = LEVELS.findIndex(([m]) => level < m);
    if (band !== a.band && now - a.lastShape > 150){
      const opts = LEVELS[band][1]; a.shape = opts[(Math.random()*opts.length)|0];
      a.mouth.innerHTML = MOUTH[a.shape]; a.band = band; a.lastShape = now; }
    a.open += (OPEN[a.shape]-a.open)*Math.min(1,dt*16);
    a.jaw.setAttribute('transform', `translate(0 ${a.open*7})`);
    a.mouth.setAttribute('transform', `translate(200 ${262+a.open*4})`);
  }
}
requestAnimationFrame(tick);

/* ===================== พูดแนะนำตัว ===================== */
function speak(a){
  speechSynthesis.cancel();
  actors.forEach(x => { x.talking=false; x.card.classList.remove('talk'); });
  const u = new SpeechSynthesisUtterance(`Hi! I'm ${a.c.name.replace('Grandma ','').replace('Grandpa ','')}. Nice to meet you!`);
  u.lang = 'en-US';
  u.rate = a.c.kid ? 1.05 : (a.c.wrinkles ? .8 : .95);
  u.pitch = a.c.kid ? 1.5 : (['Bryan','Leo','Tom','Ken','Jay','Grandpa Somchai'].includes(a.c.name) ? .8 : 1.1);
  u.onstart = () => { a.talking=true; a.card.classList.add('talk'); a.next=0; };
  u.onend = u.onerror = () => { a.talking=false; a.card.classList.remove('talk'); a.band=-1; };
  speechSynthesis.speak(u);
}
</script>
</body>
